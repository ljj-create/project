<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS-Agent 智能体</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --user-bubble: #2563eb;
    --text: #1f2937;
    --text-light: #6b7280;
    --border: #e5e7eb;
    --success: #16a34a;
    --error: #dc2626;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
    white-space: nowrap;
  }
  .logo small { font-size: 12px; color: var(--text-light); font-weight: 400; margin-left: 6px; }
  header .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .model-select {
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    max-width: 280px;
  }
  .btn {
    font-size: 13px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: #f3f4f6; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-size: 12px; color: var(--text-light); white-space: nowrap; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .status.online .dot { background: var(--success); }
  .status.offline .dot { background: var(--error); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
    scroll-behavior: smooth;
  }
  .chat-wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; }
  .msg .avatar {
    width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; user-select: none;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: #dbeafe; }
  .msg.assistant .avatar { background: #dcfce7; }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.7;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--user-bubble); color: #fff; border-top-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--card); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .bubble code {
    background: rgba(0,0,0,.06);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
  }
  .msg.user .bubble code { background: rgba(255,255,255,.18); }
  .bubble pre {
    background: #0f172a;
    color: #e2e8f0;
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 13px;
    line-height: 1.6;
    font-family: Consolas, "Courier New", monospace;
  }
  .bubble pre code { background: none; padding: 0; color: inherit; }
  .bubble .thinking {
    color: var(--text-light); font-size: 12px; border-left: 3px solid var(--border);
    padding-left: 8px; margin: 4px 0;
  }
  .bubble .tool-info { color: var(--primary); font-size: 12px; margin: 4px 0; }
  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--primary); vertical-align: text-bottom; animation: blink 1s infinite; border-radius: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  .welcome {
    text-align: center; color: var(--text-light); margin-top: 60px;
  }
  .welcome h2 { color: var(--text); margin-bottom: 8px; font-size: 20px; }
  .welcome p { font-size: 13px; line-height: 2; }
  .welcome .tag { display: inline-block; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; margin: 4px; font-size: 12px; }

  footer {
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 12px 20px 16px;
    flex-shrink: 0;
  }
  .input-wrap { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.6;
    outline: none;
    max-height: 160px;
    transition: border-color .15s;
  }
  textarea:focus { border-color: var(--primary); }
  .send-btn {
    width: 84px; height: 42px;
    font-size: 15px; font-weight: 600;
  }
  .hint { text-align: center; color: var(--text-light); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo">🤖 CS-Agent <small>本地智能体</small></div>
  <div class="right">
    <span class="status offline" id="status"><span class="dot"></span>连接中…</span>
    <select class="model-select" id="modelSelect" title="选择模型"></select>
    <button class="btn" id="clearBtn">清空对话</button>
  </div>
</header>

<main id="main">
  <div class="chat-wrap" id="chatWrap">
    <div class="welcome" id="welcome">
      <h2>你好，我是 CS-Agent 👋</h2>
      <p>我是你的计算机科学学术助手，可以帮你：</p>
      <div>
        <span class="tag">📚 知识问答（RAG 知识库）</span>
        <span class="tag">💻 代码执行与调试</span>
        <span class="tag">📄 文件解析问答</span>
        <span class="tag">🔎 论文检索</span>
        <span class="tag">🌐 联网搜索</span>
      </div>
      <p style="margin-top:12px">有什么想问的，直接输入吧！</p>
    </div>
  </div>
</main>

<footer>
  <div class="input-wrap">
    <textarea id="input" placeholder="输入你的问题，回车发送，Shift+回车换行…"></textarea>
    <button class="btn primary send-btn" id="sendBtn">发送</button>
  </div>
  <div class="hint">CS-Agent 支持知识库检索、代码执行、论文检索、联网搜索等能力</div>
</footer>

<script>
(() => {
  const main = document.getElementById('main');
  const chatWrap = document.getElementById('chatWrap');
  const welcome = document.getElementById('welcome');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const modelSelect = document.getElementById('modelSelect');
  const clearBtn = document.getElementById('clearBtn');
  const statusEl = document.getElementById('status');

  let streaming = false;

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderMd(text) {
    let out = '';
    const blocks = text.split(/```/);
    for (let i = 0; i < blocks.length; i++) {
      if (i % 2 === 1) {
        const line = blocks[i].split('\n');
        const lang = line[0].trim();
        const code = line.slice(1).join('\n');
        out += `<pre><code>${escapeHtml(code)}</code></pre>`;
      } else {
        out += escapeHtml(blocks[i])
          .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\n/g, '<br>');
      }
    }
    return out;
  }

  function addMessage(role, text) {
    welcome.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🙂' : '🤖';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderMd(text);
    div.appendChild(avatar);
    div.appendChild(bubble);
    chatWrap.appendChild(div);
    main.scrollTop = main.scrollHeight;
    return bubble;
  }

  async function loadModels() {
    try {
      const r = await fetch('/api/models');
      const data = await r.json();
      const models = data.models || [];
      modelSelect.innerHTML = '';
      for (const m of models) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        modelSelect.appendChild(opt);
      }
      if (models.length) modelSelect.selectedIndex = 0;
      setStatus(true);
    } catch (e) {
      setStatus(false);
    }
  }

  function setStatus(online) {
    statusEl.className = online ? 'status online' : 'status offline';
    statusEl.innerHTML = `<span class="dot"></span>${online ? '服务已连接' : '服务未连接'}`;
  }

  function currentModel() {
    return modelSelect.value || '';
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || streaming) return;
    input.value = '';
    addMessage('user', text);
    const bubble = addMessage('assistant', '');
    streaming = true;
    sendBtn.disabled = true;
    let content = '';
    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    try {
      const r = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: 'desktop_user', message: text, model: currentModel() })
      });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        throw new Error(err.error || ('请求失败: HTTP ' + r.status));
      }
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const events = buf.split('\n\n');
        buf = events.pop();
        for (const ev of events) {
          for (const line of ev.split('\n')) {
            if (!line.startsWith('data:')) continue;
            const payload = line.slice(5).trim();
            if (payload === '[DONE]') { cursor.remove(); continue; }
            try {
              const obj = JSON.parse(payload);
              content += obj.chunk || '';
            } catch (e) { /* 忽略无法解析的块 */ }
          }
        }
        bubble.innerHTML = renderMd(content) + (cursor.outerHTML || '');
        main.scrollTop = main.scrollHeight;
      }
      bubble.innerHTML = content ? renderMd(content) : '<i>（无内容返回）</i>';
    } catch (e) {
      bubble.innerHTML = `<span style="color:var(--error)">❌ 出错了：${escapeHtml(e.message)}</span>`;
    } finally {
      cursor.remove();
      streaming = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener('click', sendMessage);

  clearBtn.addEventListener('click', async () => {
    try {
      await fetch('/api/chat/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: 'desktop_user' }) });
    } catch (e) {}
    chatWrap.querySelectorAll('.msg').forEach(el => el.remove());
    welcome.style.display = '';
  });

  loadModels();
  input.focus();
})();
</script>
</body>
</html>
